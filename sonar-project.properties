# SonarCloud Configuration for ReqnRoll Test Automation Framework
sonar.projectKey=CodeWithMihir218_ReqnRollTestAutomationFramework
sonar.organization=mihir-dash
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=ReqnRoll Test Automation Framework
sonar.projectVersion=1.0
sonar.projectDescription=Test automation framework built with ReqnRoll, NUnit, C#, RestSharp and Selenium 4

# Source code settings - analyzing both projects
sonar.sources=TestAutomationFramework/TestAutomationFramework.Core/,TestAutomationFramework/TestAutomationFramework.Tests/
sonar.exclusions=**/bin/**,**/obj/**,**/packages/**,**/.sonar/**,**/.vs/**,**/TestResults/**,**/runtimes/**

# Language settings
sonar.language=cs

# Test settings - only the test project
sonar.tests=TestAutomationFramework/TestAutomationFramework.Tests/
sonar.test.inclusions=**/*Tests.cs,**/*Test.cs,**/Steps/**/*.cs,**/Features/**/*.feature,**/Hooks/**/*.cs
sonar.test.exclusions=**/bin/**,**/obj/**,**/Features/**/*.feature.cs

# Coverage settings
sonar.cs.nunit.reportsPaths=**/TestResults/*.xml
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverage.exclusions=**/Features/**,**/Steps/**,**/Hooks/**,**/bin/**,**/obj/**,**/runtimes/**

# ReqnRoll/SpecFlow specific settings - exclude generated files
sonar.exclusions=**/Features/**/*.feature.cs,**/bin/**,**/obj/**,**/runtimes/**